name: luacheck

on:
  push:
  pull_request:

jobs:
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Test nameplate absorption options
        run: lua tests/nameplate_absorb.lua

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: |
          set -o pipefail
          luacheck --codes --quiet . 2>&1 | tee luacheck-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luacheck-report
          path: |
            luacheck-report.txt
          if-no-files-found: ignore
